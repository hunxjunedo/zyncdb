[package]
name = "zyncdb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenv = "0.15.0"
downcast-rs = "2.0.2"
rand = "0.10.3"
random_word = { version = "0.5.3", features = ["en"] }
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["codec"] }

[dev-dependencies]
downcast-rs = "2.0.2"
tokio = { version = "1.54.0", features = ["test-util"] }
